services:
  - type: web
    name: millionaire-city
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: millionaire-city-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: millionaire-city-db
    plan: free
